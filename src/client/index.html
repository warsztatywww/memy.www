<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memiarka — panel</title>
  <link rel="stylesheet" href="./panel/style.css">
</head>
<body>
  <header>
    <h1>Memiarka — panel</h1>
    <a href="/player" target="_blank">otwórz odtwarzacz ↗</a>
  </header>
  <section id="now-playing">
    <h2>Teraz gra</h2>
    <div id="now-content">łączenie…</div>
    <div class="buttons">
      <button id="play-ad" disabled>Odtwórz reklamę teraz</button>
      <button id="skip" disabled>Skip</button>
      <label class="auto-ads"><input id="auto-ads" type="checkbox" checked> Automatyczne reklamy</label>
    </div>
  </section>
  <section id="upload-section">
    <h2>Wrzuć mema</h2>
    <div id="upload-dropzone">
      <span>przeciągnij pliki tutaj albo</span>
      <button id="upload-pick" type="button">Wybierz pliki</button>
      <input id="upload-input" type="file" multiple hidden
             accept=".jpg,.jpeg,.png,.gif,.webp,.mp4,.webm">
    </div>
    <ul id="upload-results"></ul>
  </section>
  <section id="ticker-section">
    <h2>Pasek informacyjny</h2>
    <form id="ticker-form">
      <input id="ticker-text" type="text" maxlength="500" placeholder="treść komunikatu…" autocomplete="off">
      <button type="submit">Dodaj</button>
    </form>
    <ul id="ticker-list"></ul>
  </section>
  <section id="history-section">
    <h2>Historia <label>pokaż ostatnie <input id="limit" type="number" min="1" value="20"> </label></h2>
    <ul id="history"></ul>
  </section>
  <dialog id="report-dialog">
    <h2>Zgłoś mema</h2>
    <p id="report-file"></p>
    <div id="report-reasons"></div>
    <button id="report-cancel" type="button">Anuluj</button>
  </dialog>
  <div id="drop-overlay" hidden>upuść, by wrzucić mema</div>
  <script type="module" src="./panel/main.ts"></script>
</body>
</html>
