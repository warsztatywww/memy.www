version: '3'

services:
  memiarka:
    build: .
    restart: unless-stopped
    volumes:
      - /mnt/internet.www/memy.www:/media
      - /mnt/internet.www/youtube.com:/ads
      - ./data:/data
    # HA_TOKEN (token Home Assistanta) — wymagany, trzymany w .env obok tego pliku
    env_file:
      - .env
    environment:
      AD_INTERVAL: 25  # memów — ~5 min między reklamami przy obrazkach po 10 s
      SPECIAL_INTERVAL: 120  # s
    labels:
      - traefik.enable=true
      - traefik.http.routers.memiarka.rule=Host(`memy.www22.duck.edu.pl`)
