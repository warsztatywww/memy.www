version: '3'

services:
  memiarka:
    build: .
    restart: unless-stopped
    volumes:
      - /mnt/internet.www/memy.www:/media
      - /mnt/internet.www/youtube.com:/ads
      - ./data:/data
    environment:
      # token Home Assistanta (smart.www22.duck.edu.pl) — wymagany
      HA_TOKEN: "REDACTED_HA_TOKEN"
      AD_INTERVAL: 100  # memów
      SPECIAL_INTERVAL: 120  # s
    labels:
      - traefik.enable=true
      - traefik.http.routers.memiarka.rule=Host(`memy.www22.duck.edu.pl`)
